{% extends "base.html" %}{% block title %}Relatórios da sessão{% endblock %}{% block head %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>{% endblock %}
{% block content %}<section class="topbar"><div><span class="eyebrow">Relatórios</span><h1>📊 {{ sessao['turma'] }}</h1></div><div><a class="button secondary" href="{{ url_for('relatorio_detalhado', codigo=codigo, token=token) }}">Visão detalhada por aluno</a> <a class="button secondary" href="{{ url_for('sessoes_professor') }}">Voltar às sessões</a></div></section><div id="relatorios"><p class="muted">Carregando gráficos...</p></div><script>window.FEEDBACK_CODIGO={{ codigo|tojson }};window.FEEDBACK_TOKEN={{ token|tojson }};</script><script src="{{ url_for('static', filename='relatorio.js') }}"></script>{% endblock %}
