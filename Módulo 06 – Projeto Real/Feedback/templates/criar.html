{% extends "base.html" %}{% block title %}Criar feedback{% endblock %}
{% block content %}
<section class="card narrow"><span class="eyebrow">Painel do professor</span><h1>Feedback de Turmas</h1>
<p class="muted">Crie uma pesquisa e compartilhe o link com os alunos.</p>
{% if erro %}<div class="alert error">{{ erro }}</div>{% endif %}
<form method="post" enctype="multipart/form-data">
  <label for="turma">Nome da turma</label><input id="turma" name="turma" required placeholder="Python - Turma 01">
  <label for="arquivo_csv">Perguntas em CSV <small>(opcional: usa perguntas.csv)</small></label>
  <input id="arquivo_csv" name="arquivo_csv" type="file" accept=".csv">
  <button type="submit">Criar feedback</button>
</form></section>
{% endblock %}
