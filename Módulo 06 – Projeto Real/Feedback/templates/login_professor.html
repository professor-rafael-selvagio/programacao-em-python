{% extends "base.html" %}{% block title %}Login do professor{% endblock %}
{% block content %}<section class="card narrow"><span class="eyebrow">Área restrita</span><h1>👨‍🏫 Login do professor</h1><p class="muted">Entre para criar e acompanhar os feedbacks.</p>{% if erro %}<div class="alert error">{{ erro }}</div>{% endif %}<form method="post"><input type="hidden" name="proxima" value="{{ proxima }}"><label for="login">E-mail</label><input id="login" name="login" type="email" required autofocus><label for="senha">Senha</label><input id="senha" name="senha" type="password" required><button type="submit">Entrar</button></form></section>{% endblock %}
